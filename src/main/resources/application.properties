spring.application.name=Hair_Customized_Ai
spring.profiles.default=postgres

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

app.security.enabled=${APP_SECURITY_ENABLED:false}
app.dev.mock-ai-enabled=${APP_DEV_MOCK_AI_ENABLED:false}

app.storage.mode=${APP_STORAGE_MODE:mock}
app.storage.bucket=${APP_STORAGE_BUCKET:hair-customized-ai-dev}
app.storage.region=${AWS_REGION:ap-northeast-2}
app.storage.endpoint=${APP_STORAGE_ENDPOINT:}
app.storage.force-path-style=${APP_STORAGE_FORCE_PATH_STYLE:false}
app.storage.upload-url-ttl=${APP_STORAGE_UPLOAD_URL_TTL:10m}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/mock-storage}
app.storage.mock-upload-base-url=${APP_STORAGE_MOCK_UPLOAD_BASE_URL:http://localhost:8080/mock-upload}

app.queue.provider=${APP_QUEUE_PROVIDER:log}
app.queue.face-profile-queue=${APP_QUEUE_FACE_PROFILE_QUEUE:ai.face-profile.preprocess}
app.queue.fitting-job-queue=${APP_QUEUE_FITTING_JOB_QUEUE:ai.fitting.generate}

app.ai.worker.base-url=${APP_AI_WORKER_BASE_URL:http://localhost:8000}
app.ai.worker.backend-base-url=${APP_AI_WORKER_BACKEND_BASE_URL:http://localhost:8080}
